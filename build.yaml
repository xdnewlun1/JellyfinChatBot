changelog: |
  ## v2.0.0.0
  - Requires Jellyfin 12.0 or newer; plugin now targets .NET 10
  - Builds against Jellyfin.Controller 12.0.0 (works on 12.0 and 12.1)
  - Drops support for Jellyfin 10.x, which cannot load .NET 10 plugins
  - Tool arguments are coerced rather than throwing: a model sending
    limit: 10.0 no longer kills the tool call

  ## v1.2.0.0
  - Chat now works with any OpenAI-compatible endpoint (Ollama /v1, LM Studio,
    llama.cpp, vLLM, LiteLLM, OpenAI, OpenRouter) instead of Ollama's native API
  - Configurable primary model plus an ordered list of fallback models
  - A failing model is skipped for 60 seconds instead of stalling every chat turn
  - API key support for backends that require authentication
  - Configurable request timeout
  - Model reasoning is kept out of the visible reply on every backend
  - Existing Ollama URL/model settings migrate automatically on upgrade

  ## v1.1.1.0
  - Strengthened system prompt to enforce tool calling before responding
  - LLM no longer skips tools and fabricates recommendations
  - Removed emoji usage from default prompt
  - More concise bot responses

  ## v1.1.0.0
  - Personalized recommendations based on watch history
  - TMDB discovery: find movies/TV by genre, year, rating, popularity
  - "Similar to" recommendations via TMDB
  - Enhanced library search: filter by year range, tags, community rating
  - Library results now include genres and ratings
  - TMDB configuration section in plugin settings

  ## v1.0.0.0
  - Initial release
  - Ollama-powered chat with configurable model
  - Library search integration
  - Jellyseerr/Overseerr request support
  - Floating chat widget with playback detection
