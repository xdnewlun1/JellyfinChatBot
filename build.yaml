overview: "AI chatbot plugin for any OpenAI-compatible endpoint, with library search, recommendations, and Jellyseerr integration"
description: "Adds an AI chatbot to Jellyfin that can search your media library, give personalized recommendations based on watch history, discover content via TMDB, and help request new media through Jellyseerr/Overseerr."
category: "General"
artifacts:
